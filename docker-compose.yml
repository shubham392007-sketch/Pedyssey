version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pedyssey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    environment:
      - PEDYSSEY_DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/pedyssey
      - OLLAMA_HOST=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
